name: Source Odds

# Deliberately a SEPARATE, SLOWER workflow from source-data.yml. Odds
# sourcing costs real API credits (the-odds-api.com free tier: 500
# credits/month, 1 credit per sport_key polled here) — running it on the
# same 30-min cadence as scores/news would burn through the monthly
# budget in about a day for even 3 leagues. Every 4 hours = 6 runs/day;
# 3 leagues × 6 × 30 days ≈ 540 credits — still tight. Trim the interval
# below or SPORT_KEY_ALIASES in source-odds.js to fit your actual slate.
on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — see the credit-budget note above before shortening this
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-odds
  cancel-in-progress: false

jobs:
  source-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Source odds from the-odds-api.com
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/source-odds.js

      - name: Commit sourced odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds state/unmapped-leagues.json state/unmatched-odds-fixtures.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Source odds: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
