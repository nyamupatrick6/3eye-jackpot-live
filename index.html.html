function pickCorrect(pick, actual) {
  if (!pick || !actual) return null;
  return pick.trim().toUpperCase() === actual.trim().toUpperCase();
}

// Slate names carry the platform inline (e.g. "SportPesa Mega Jackpot Pro — ...");
// this pulls it out so we can compare platforms head-to-head for "Best Site" stat.
function platformOf(name) {
  if (!name) return null;
  const n = name.toLowerCase();
  if (n.includes('sportpesa')) return 'SportPesa';
  if (n.includes('betika')) return 'Betika';
  if (n.includes('mozart')) return 'Mozartbet';
  if (n.includes('sportybet')) return 'Sportybet';
  if (n.includes('odibet')) return 'Odibets';
  return null;
}
// Fixed display order for the 5 platform sections in the track record modal.
// Any slate whose platform can't be identified from its name falls into "Other".
const PLATFORM_ORDER = ['SportPesa', 'Betika', 'Mozartbet', 'Sportybet', 'Odibets', 'Other'];

// Per-platform jackpot bonus thresholds — hits needed to unlock the site's
// bonus payout. Each platform maps to a list of size tiers ({ total, threshold })
// since a platform can run more than one jackpot size with a different bonus
// bar for each (e.g. SportPesa runs both a 17-leg Mega slate needing 12 hits
// and a 13-leg slate needing 10 hits). getBonusStatus below matches a slate
// to its tier by its own leg count — exact match preferred, nearest tier as
// fallback for an unrecognized size, so a slate is never silently skipped.
const BONUS_THRESHOLDS = {
  SportPesa: [
    { threshold: 12, total: 17 },
    { threshold: 10, total: 13 }
  ],
  Betika: [{ threshold: 12, total: 15 }],
  Mozartbet: [{ threshold: 10, total: 16 }],
  Sportybet: [{ threshold: 11, total: 13 }],
  Odibets: [{ threshold: 8, total: 10 }]
};

/**
 * Live bonus status for a slate, evaluated against its platform's
 * BONUS_THRESHOLDS tier matching its own leg count. Updates as legs resolve
 * rather than waiting for the whole slate to grade:
 *  - hits already at/above threshold -> bonus is locked in ("Bonus won"),
 *    regardless of legs still pending.
 *  - hits + remaining unresolved legs can't reach threshold -> bonus is out
 *    of reach. If the slate is fully graded this reads as "N missed to
 *    bonus" (N = threshold - hits); if legs are still pending it reads as
 *    mathematically eliminated ahead of full grading.
 *  - otherwise still live -> "N to bonus" (N = threshold - hits still
 *    needed from the remaining legs).
 * Returns null for slates on a platform with no configured threshold tiers.
 */
function getBonusStatus(platform, hits, resolvedCount, totalLegs) {
  const tiers = BONUS_THRESHOLDS[platform];
  if (!tiers || !tiers.length || !totalLegs) return null;
  // Exact match on slate size, else the tier whose total is closest to this
  // slate's leg count (so an odd-sized slate still gets a sensible bar
  // instead of no badge at all).
  const cfg = tiers.find(t => t.total === totalLegs)
